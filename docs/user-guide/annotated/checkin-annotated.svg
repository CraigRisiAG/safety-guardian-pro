<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a" />
    </marker>
    <style>
      .label { font: 600 20px 'Segoe UI', sans-serif; fill: #111827; }
      .box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .small { font: 500 15px 'Segoe UI', sans-serif; fill: #1f2937; }
      .line { stroke: #16a34a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <image href="../screenshots/05-checkin.png" x="0" y="0" width="1440" height="900" />

  <rect class="box" x="955" y="80" width="445" height="120" />
  <text class="label" x="975" y="115">1) Active Drill Context</text>
  <text class="small" x="975" y="145">Confirms drill state and scope while checking in</text>
  <line class="line" x1="980" y1="170" x2="760" y2="140" />

  <rect class="box" x="955" y="255" width="445" height="130" />
  <text class="label" x="975" y="290">2) Personnel Search</text>
  <text class="small" x="975" y="320">Find staff quickly using saved personnel records</text>
  <line class="line" x1="980" y1="345" x2="810" y2="300" />

  <rect class="box" x="955" y="495" width="445" height="150" />
  <text class="label" x="975" y="530">3) Status Selection</text>
  <text class="small" x="975" y="560">Record safe, needs assistance, or pending</text>
  <text class="small" x="975" y="585">for each person during the active drill</text>
  <line class="line" x1="980" y1="615" x2="820" y2="560" />
</svg>
